<svg viewBox="0 0 1000 1400" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono','SFMono-Regular',Consolas,Menlo,monospace">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f10"/>
      <stop offset="100%" stop-color="#0d1315"/>
    </linearGradient>

    <radialGradient id="glow" cx="20%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#35e0b0" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#35e0b0" stop-opacity="0"/>
    </radialGradient>

    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <marker id="arrowSignal" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#35e0b0"/>
    </marker>
    <marker id="arrowSelf" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#35a0e0"/>
    </marker>
    <marker id="arrowWarn" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#e0a935"/>
    </marker>
    <marker id="arrowDim" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#4b615e"/>
    </marker>

    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#151b1d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1000" height="1400" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1000" height="1400" fill="url(#glow)"/>

  <!-- Title block -->
  <text x="50" y="56" fill="#35e0b0" font-size="13" letter-spacing="3" font-weight="600">GROUP CHAT</text>
  <text x="50" y="80" fill="#d7e2e0" font-size="24" font-weight="700" letter-spacing="0.5">System Architecture</text>
  <text x="50" y="104" fill="#6f8a87" font-size="12.5">FastAPI · WebSocket · AES-256-GCM · Ed25519 · SQLite</text>
  <line x1="50" y1="122" x2="950" y2="122" stroke="#1e2a2e" stroke-width="1"/>

  <!-- ============ LEGEND ============ -->
  <g transform="translate(700,40)">
    <rect x="0" y="0" width="250" height="70" rx="8" fill="#10161a" stroke="#1e2a2e"/>
    <text x="14" y="18" fill="#6f8a87" font-size="9" letter-spacing="1.5">LEGEND</text>
    <circle cx="20" cy="34" r="4" fill="#35a0e0"/>
    <text x="30" y="38" fill="#9fb3b0" font-size="10.5">client / process boundary</text>
    <circle cx="20" cy="52" r="4" fill="#e0a935"/>
    <text x="30" y="56" fill="#9fb3b0" font-size="10.5">protocol / dispatch layer</text>
    <circle cx="160" cy="34" r="4" fill="#35e0b0"/>
    <text x="170" y="38" fill="#9fb3b0" font-size="10.5">state / crypto</text>
    <line x1="150" y1="52" x2="170" y2="52" stroke="#4b615e" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="176" y="56" fill="#9fb3b0" font-size="10.5">broadcast</text>
  </g>

  <!-- ============ BROWSER LAYER ============ -->
  <g filter="url(#softShadow)">
    <rect x="280" y="150" width="440" height="110" rx="10" fill="#10161a" stroke="#35a0e0" stroke-opacity="0.55" stroke-width="1.5"/>
  </g>
  <rect x="280" y="150" width="440" height="30" rx="10" fill="#35a0e0" fill-opacity="0.12"/>
  <rect x="280" y="150" width="440" height="30" fill="#35a0e0" fill-opacity="0.0"/>
  <circle cx="300" cy="165" r="4" fill="#e05f5f"/>
  <circle cx="313" cy="165" r="4" fill="#e0a935"/>
  <circle cx="326" cy="165" r="4" fill="#35e0b0"/>
  <text x="500" y="169" fill="#9fb3b0" font-size="10.5" text-anchor="middle" letter-spacing="1">CLIENT — BROWSER</text>

  <text x="305" y="205" fill="#d7e2e0" font-size="14" font-weight="600">public/index.html + style.css</text>
  <text x="305" y="224" fill="#9fb3b0" font-size="12">public/app.js</text>
  <text x="305" y="242" fill="#6f8a87" font-size="11">WebSocket client · auto-reconnect (exp. backoff) · DOM rendering (textContent-only)</text>

  <!-- connector: browser -> app.py -->
  <line x1="500" y1="260" x2="500" y2="320" stroke="#35a0e0" stroke-width="2" marker-end="url(#arrowSelf)"/>
  <rect x="410" y="272" width="180" height="34" rx="6" fill="#0d1315" stroke="#1e2a2e"/>
  <text x="500" y="286" fill="#35a0e0" font-size="10" text-anchor="middle" font-weight="600">WSS/WS  /ws</text>
  <text x="500" y="300" fill="#6f8a87" font-size="9" text-anchor="middle">+ static HTTP (GET /, /*)</text>

  <!-- ============ APP.PY LAYER ============ -->
  <g filter="url(#softShadow)">
    <rect x="230" y="330" width="540" height="100" rx="10" fill="#10161a" stroke="#35a0e0" stroke-opacity="0.4" stroke-width="1.5"/>
  </g>
  <rect x="230" y="330" width="540" height="28" rx="10" fill="#35a0e0" fill-opacity="0.1"/>
  <text x="500" y="349" fill="#9fb3b0" font-size="10.5" text-anchor="middle" letter-spacing="1">app.py — FASTAPI APPLICATION</text>
  <text x="252" y="382" fill="#d7e2e0" font-size="13.5" font-weight="600">Lifespan · Routes · Static file serving</text>
  <text x="252" y="401" fill="#6f8a87" font-size="11">GET / · GET /{filename:path} (path-traversal guarded) · @app.websocket('/ws')</text>
  <text x="252" y="418" fill="#6f8a87" font-size="11">uvicorn (ws_ping_interval / ws_ping_timeout · heartbeat)</text>

  <!-- connector: app.py -> ws_server.py -->
  <line x1="500" y1="430" x2="500" y2="490" stroke="#e0a935" stroke-width="2" marker-end="url(#arrowWarn)"/>

  <!-- ============ WS_SERVER.PY HUB ============ -->
  <g filter="url(#softShadow)">
    <rect x="150" y="500" width="700" height="130" rx="10" fill="url(#hubGrad)" stroke="#e0a935" stroke-opacity="0.55" stroke-width="1.5"/>
  </g>
  <rect x="150" y="500" width="700" height="28" rx="10" fill="#e0a935" fill-opacity="0.12"/>
  <text x="500" y="519" fill="#e0a935" font-size="10.5" text-anchor="middle" letter-spacing="1" font-weight="700">server/ws_server.py — PROTOCOL HUB</text>

  <g font-size="10.5" fill="#c9d6d3">
    <text x="176" y="552">▸ dispatch(type)</text>
    <text x="176" y="570">join · message · private_message</text>
    <text x="176" y="588">switch_room · create_room · typing</text>

    <text x="400" y="552">▸ moderation</text>
    <text x="400" y="570">kick · mute · unmute (admin-gated)</text>
    <text x="400" y="588">TokenBucket rate limiter / connection</text>

    <text x="616" y="552">▸ background thread</text>
    <text x="616" y="570">presence sweep (online→away)</text>
    <text x="616" y="588">graceful shutdown broadcast</text>
  </g>

  <!-- connectors: hub -> rooms.py / store.py -->
  <line x1="330" y1="630" x2="330" y2="690" stroke="#35e0b0" stroke-width="2" marker-end="url(#arrowSignal)"/>
  <line x1="670" y1="630" x2="670" y2="690" stroke="#35e0b0" stroke-width="2" marker-end="url(#arrowSignal)"/>

  <!-- ============ ROOMS.PY ============ -->
  <g filter="url(#softShadow)">
    <rect x="120" y="700" width="420" height="150" rx="10" fill="#10161a" stroke="#35e0b0" stroke-opacity="0.5" stroke-width="1.5"/>
  </g>
  <rect x="120" y="700" width="420" height="28" rx="10" fill="#35e0b0" fill-opacity="0.1"/>
  <text x="330" y="719" fill="#35e0b0" font-size="10.5" text-anchor="middle" letter-spacing="1" font-weight="700">server/rooms.py — IN-MEMORY STATE</text>

  <g font-size="11" fill="#c9d6d3">
    <text x="144" y="750">RoomManager</text>
    <text x="144" y="770" fill="#6f8a87" font-size="10.5">rooms: {name → {members, created_at}}</text>
    <text x="144" y="788" fill="#6f8a87" font-size="10.5">ensure_room · join · leave</text>
    <text x="144" y="806" fill="#6f8a87" font-size="10.5">get_usernames · list_rooms</text>
    <text x="144" y="826" fill="#6f8a87" font-size="10.5">broadcast(room, payload)</text>
  </g>
  <rect x="380" y="738" width="140" height="90" rx="6" fill="#0d1315" stroke="#1e2a2e"/>
  <text x="450" y="758" fill="#9fb3b0" font-size="9.5" text-anchor="middle">per-member</text>
  <text x="450" y="774" fill="#d7e2e0" font-size="10" text-anchor="middle">ws · loop</text>
  <text x="450" y="790" fill="#d7e2e0" font-size="10" text-anchor="middle">username</text>
  <text x="450" y="806" fill="#d7e2e0" font-size="10" text-anchor="middle">connected</text>

  <!-- dashed broadcast arrow back up to browser -->
  <path d="M 330 700 C 330 500, 120 380, 280 205" fill="none" stroke="#4b615e" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowDim)"/>
  <text x="120" y="470" fill="#6f8a87" font-size="9.5" transform="rotate(-77 120 470)">broadcast → all room sockets</text>

  <!-- ============ STORE.PY ============ -->
  <g filter="url(#softShadow)">
    <rect x="560" y="700" width="420" height="150" rx="10" fill="#10161a" stroke="#35e0b0" stroke-opacity="0.5" stroke-width="1.5"/>
  </g>
  <rect x="560" y="700" width="420" height="28" rx="10" fill="#35e0b0" fill-opacity="0.1"/>
  <text x="770" y="719" fill="#35e0b0" font-size="10.5" text-anchor="middle" letter-spacing="1" font-weight="700">server/store.py — PERSISTENCE PIPELINE</text>

  <g font-size="11" fill="#c9d6d3">
    <text x="584" y="748">append_message()</text>
  </g>
  <g font-size="9.5" fill="#9fb3b0">
    <rect x="584" y="758" width="90" height="20" rx="4" fill="#0d1315" stroke="#1e2a2e"/>
    <text x="629" y="772" text-anchor="middle">① Encrypt</text>
    <rect x="684" y="758" width="90" height="20" rx="4" fill="#0d1315" stroke="#1e2a2e"/>
    <text x="729" y="772" text-anchor="middle">② Sign</text>
    <rect x="784" y="758" width="90" height="20" rx="4" fill="#0d1315" stroke="#1e2a2e"/>
    <text x="829" y="772" text-anchor="middle">③ Persist</text>
  </g>
  <path d="M674,768 H684 M774,768 H784" stroke="#35e0b0" stroke-width="1.5" marker-end="url(#arrowSignal)"/>

  <text x="584" y="800" fill="#c9d6d3" font-size="11">get_history()</text>
  <g font-size="9.5" fill="#9fb3b0">
    <rect x="584" y="808" width="90" height="20" rx="4" fill="#0d1315" stroke="#1e2a2e"/>
    <text x="629" y="822" text-anchor="middle">④ Verify</text>
    <rect x="684" y="808" width="90" height="20" rx="4" fill="#0d1315" stroke="#1e2a2e"/>
    <text x="729" y="822" text-anchor="middle">⑤ Decrypt</text>
    <rect x="784" y="808" width="90" height="20" rx="4" fill="#e05f5f" fill-opacity="0.12" stroke="#e05f5f" stroke-opacity="0.5"/>
    <text x="829" y="822" fill="#e0908f" text-anchor="middle">tamper flag</text>
  </g>
  <path d="M674,818 H684 M774,818 H784" stroke="#35a0e0" stroke-width="1.5" marker-end="url(#arrowSelf)"/>

  <!-- connector: store.py -> crypto.py -->
  <line x1="770" y1="850" x2="770" y2="900" stroke="#35e0b0" stroke-width="2" marker-end="url(#arrowSignal)"/>
  <!-- connector: store.py -> sqlite -->
  <line x1="620" y1="850" x2="450" y2="1000" stroke="#35a0e0" stroke-width="2" marker-end="url(#arrowSelf)"/>

  <!-- ============ CRYPTO.PY ============ -->
  <g filter="url(#softShadow)">
    <rect x="560" y="910" width="420" height="120" rx="10" fill="#10161a" stroke="#e05f5f" stroke-opacity="0.5" stroke-width="1.5"/>
  </g>
  <rect x="560" y="910" width="420" height="28" rx="10" fill="#e05f5f" fill-opacity="0.1"/>
  <text x="770" y="929" fill="#e0908f" font-size="10.5" text-anchor="middle" letter-spacing="1" font-weight="700">server/crypto.py — PRIMITIVES</text>

  <rect x="584" y="948" width="180" height="66" rx="6" fill="#0d1315" stroke="#1e2a2e"/>
  <text x="674" y="966" fill="#d7e2e0" font-size="11" text-anchor="middle" font-weight="600">AES-256-GCM</text>
  <text x="674" y="982" fill="#6f8a87" font-size="9.5" text-anchor="middle">master.key · 96-bit nonce</text>
  <text x="674" y="998" fill="#6f8a87" font-size="9.5" text-anchor="middle">encrypt_message / decrypt_message</text>

  <rect x="776" y="948" width="180" height="66" rx="6" fill="#0d1315" stroke="#1e2a2e"/>
  <text x="866" y="966" fill="#d7e2e0" font-size="11" text-anchor="middle" font-weight="600">Ed25519</text>
  <text x="866" y="982" fill="#6f8a87" font-size="9.5" text-anchor="middle">per-user keypair</text>
  <text x="866" y="998" fill="#6f8a87" font-size="9.5" text-anchor="middle">sign_message / verify_signature</text>

  <!-- ============ SQLITE ============ -->
  <g filter="url(#softShadow)">
    <ellipse cx="450" cy="1000" rx="130" ry="18" fill="#151b1d" stroke="#35a0e0" stroke-opacity="0.6"/>
    <rect x="320" y="1000" width="260" height="70" fill="#10161a" stroke="#35a0e0" stroke-opacity="0.4"/>
    <ellipse cx="450" cy="1070" rx="130" ry="18" fill="#10161a" stroke="#35a0e0" stroke-opacity="0.6"/>
    <path d="M320,1000 L320,1070" stroke="#35a0e0" stroke-opacity="0.4"/>
    <path d="M580,1000 L580,1070" stroke="#35a0e0" stroke-opacity="0.4"/>
  </g>
  <ellipse cx="450" cy="1000" rx="130" ry="18" fill="#35a0e0" fill-opacity="0.15"/>
  <text x="450" y="1005" fill="#9fb3b0" font-size="10" text-anchor="middle" font-weight="700">data/chat.db (SQLite)</text>
  <text x="450" y="1040" fill="#6f8a87" font-size="10" text-anchor="middle">messages (id, room_id, sender,</text>
  <text x="450" y="1055" fill="#6f8a87" font-size="10" text-anchor="middle">ciphertext, nonce, signature, ts)</text>
  <text x="450" y="1090" fill="#6f8a87" font-size="9.5" text-anchor="middle">user_keys (username, public_key)</text>

  <!-- key files annotation -->
  <g transform="translate(600,1058)">
    <rect x="0" y="0" width="230" height="70" rx="8" fill="#10161a" stroke="#e0a935" stroke-opacity="0.4"/>
    <text x="14" y="18" fill="#e0a935" font-size="9.5" letter-spacing="1">FILESYSTEM SECRETS</text>
    <text x="14" y="36" fill="#c9d6d3" font-size="10">data/master.key</text>
    <text x="14" y="52" fill="#c9d6d3" font-size="10">data/keys/&lt;username&gt;.key</text>
  </g>
  <line x1="756" y1="1030" x2="700" y2="1058" stroke="#e0a935" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- ============ TOOLS ROW ============ -->
  <g transform="translate(60,1150)">
    <rect x="0" y="0" width="880" height="90" rx="10" fill="#0d1315" stroke="#1e2a2e"/>
    <text x="20" y="22" fill="#6f8a87" font-size="9.5" letter-spacing="1.5">OPERATIONAL CLI UTILITIES</text>

    <rect x="20" y="34" width="260" height="42" rx="6" fill="#10161a" stroke="#1e2a2e"/>
    <text x="34" y="52" fill="#d7e2e0" font-size="11" font-weight="600">clear_db.py</text>
    <text x="34" y="68" fill="#6f8a87" font-size="9.5">wipe messages + user_keys, VACUUM</text>

    <rect x="300" y="34" width="260" height="42" rx="6" fill="#10161a" stroke="#e05f5f" stroke-opacity="0.4"/>
    <text x="314" y="52" fill="#e0908f" font-size="11" font-weight="600">tamper_last.py</text>
    <text x="314" y="68" fill="#6f8a87" font-size="9.5">flip 1 bit → triggers AES-GCM tamper flag</text>

    <rect x="580" y="34" width="280" height="42" rx="6" fill="#10161a" stroke="#1e2a2e"/>
    <text x="594" y="52" fill="#d7e2e0" font-size="11" font-weight="600">server/logger.py</text>
    <text x="594" y="68" fill="#6f8a87" font-size="9.5">structured JSON events → stdout</text>
  </g>

  <!-- footer -->
  <line x1="50" y1="1268" x2="950" y2="1268" stroke="#1e2a2e" stroke-width="1"/>
  <text x="500" y="1290" fill="#4b615e" font-size="10" text-anchor="middle" letter-spacing="1">single-process deployment · in-memory room state · SQLite-backed durable, encrypted, signed message log</text>
</svg>
